openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Nigerian Online Voting System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and biometric verification
  - name: elections
    description: Election management
  - name: candidates
    description: Candidate management
  - name: votes
    description: Voting operations
  - name: voters
    description: Voter management
  - name: results
    description: Election results
  - name: dashboard
    description: Admin dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/voter/register:
    post:
      operationId: registerVoter
      tags: [auth]
      summary: Register a voter with biometric data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoterRegistrationInput"
      responses:
        "201":
          description: Voter registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voter"
        "400":
          description: Validation error or duplicate NIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Voter is under 18 years old and not eligible to register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/voter/verify:
    post:
      operationId: verifyVoterBiometric
      tags: [auth]
      summary: Verify voter identity via biometric face descriptor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricVerifyInput"
      responses:
        "200":
          description: Voter verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoterAuthResponse"
        "401":
          description: Biometric mismatch or voter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Voter is under 18 years old and not eligible to vote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # VOTERS
  /voters:
    get:
      operationId: listVoters
      tags: [voters]
      summary: List all registered voters (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: state
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [registered, verified, voted]
      responses:
        "200":
          description: List of voters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoterList"

  /voters/{id}:
    get:
      operationId: getVoter
      tags: [voters]
      summary: Get voter details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voter details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voter"
        "404":
          description: Voter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ELECTIONS
  /elections:
    get:
      operationId: listElections
      tags: [elections]
      summary: List all elections
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, active, ended]
      responses:
        "200":
          description: List of elections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Election"
    post:
      operationId: createElection
      tags: [elections]
      summary: Create a new election (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionInput"
      responses:
        "201":
          description: Election created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"

  /elections/{id}:
    get:
      operationId: getElection
      tags: [elections]
      summary: Get election details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Election details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateElection
      tags: [elections]
      summary: Update election (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionUpdate"
      responses:
        "200":
          description: Updated election
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Election"
    delete:
      operationId: deleteElection
      tags: [elections]
      summary: Delete election (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # CANDIDATES
  /elections/{electionId}/candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List candidates for an election
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Add a candidate to an election (admin)
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateInput"
      responses:
        "201":
          description: Candidate added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /elections/{electionId}/candidates/{id}:
    patch:
      operationId: updateCandidate
      tags: [candidates]
      summary: Update a candidate
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateUpdate"
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
    delete:
      operationId: deleteCandidate
      tags: [candidates]
      summary: Remove a candidate
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # VOTES
  /votes:
    post:
      operationId: castVote
      tags: [votes]
      summary: Cast a vote (requires biometric token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteInput"
      responses:
        "201":
          description: Vote cast successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteReceipt"
        "400":
          description: Already voted or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized or biometric token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /votes/verify:
    get:
      operationId: verifyVoteReceipt
      tags: [votes]
      summary: Verify a vote receipt (public, no auth required)
      parameters:
        - name: receipt
          in: query
          required: true
          schema:
            type: string
          description: The receipt code (e.g. NV-ABCDEF123456)
      responses:
        "200":
          description: Receipt is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptVerification"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # RESULTS
  /elections/{id}/results:
    get:
      operationId: getElectionResults
      tags: [results]
      summary: Get election results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Election results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionResults"

  # DASHBOARD
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get overall system statistics (admin)
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent voting activity
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/voter-turnout:
    get:
      operationId: getVoterTurnout
      tags: [dashboard]
      summary: Get voter turnout breakdown by state
      responses:
        "200":
          description: Turnout data by state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TurnoutByState"

  /dashboard/audit-log:
    get:
      operationId: getAuditLog
      tags: [dashboard]
      summary: Get full election audit log with vote timeline
      security:
        - adminBearerAuth: []
      parameters:
        - name: electionId
          in: query
          schema:
            type: integer
        - name: state
          in: query
          schema:
            type: string
        - name: party
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit log data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, admin]
      properties:
        token:
          type: string
        admin:
          $ref: "#/components/schemas/Admin"

    Admin:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string

    VoterRegistrationInput:
      type: object
      required: [nin, fullName, dateOfBirth, state, lga, pollingUnit, phoneNumber, faceDescriptor]
      properties:
        nin:
          type: string
          description: National Identification Number (11 digits)
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
          description: Must correspond to an age of 18 or older
        state:
          type: string
        lga:
          type: string
        pollingUnit:
          type: string
        phoneNumber:
          type: string
        faceDescriptor:
          type: array
          items:
            type: number
          description: 128-dimensional face-api.js face descriptor float array

    BiometricVerifyInput:
      type: object
      required: [nin, faceDescriptor]
      properties:
        nin:
          type: string
        faceDescriptor:
          type: array
          items:
            type: number
          description: Face descriptor for matching

    VoterAuthResponse:
      type: object
      required: [token, voter]
      properties:
        token:
          type: string
        voter:
          $ref: "#/components/schemas/Voter"

    Voter:
      type: object
      required: [id, nin, fullName, state, lga, pollingUnit, status, createdAt]
      properties:
        id:
          type: integer
        nin:
          type: string
        fullName:
          type: string
        dateOfBirth:
          type: ["string", "null"]
        state:
          type: string
        lga:
          type: string
        pollingUnit:
          type: string
        phoneNumber:
          type: ["string", "null"]
        status:
          type: string
          enum: [registered, verified, voted]
        createdAt:
          type: string

    VoterList:
      type: object
      required: [voters, total, page, limit]
      properties:
        voters:
          type: array
          items:
            $ref: "#/components/schemas/Voter"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Election:
      type: object
      required: [id, title, type, startDate, endDate, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
          enum: [presidential, gubernatorial, senatorial, house_of_reps, local_government]
        startDate:
          type: string
        endDate:
          type: string
        status:
          type: string
          enum: [upcoming, active, ended]
        candidateCount:
          type: ["integer", "null"]
        totalVotes:
          type: ["integer", "null"]
        createdAt:
          type: string

    ElectionInput:
      type: object
      required: [title, type, startDate, endDate]
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [presidential, gubernatorial, senatorial, house_of_reps, local_government]
        startDate:
          type: string
        endDate:
          type: string

    ElectionUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        status:
          type: string
          enum: [upcoming, active, ended]

    Candidate:
      type: object
      required: [id, electionId, fullName, party, partyAbbreviation, createdAt]
      properties:
        id:
          type: integer
        electionId:
          type: integer
        fullName:
          type: string
        party:
          type: string
        partyAbbreviation:
          type: string
        state:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        manifesto:
          type: ["string", "null"]
        voteCount:
          type: ["integer", "null"]
        createdAt:
          type: string

    CandidateInput:
      type: object
      required: [fullName, party, partyAbbreviation]
      properties:
        fullName:
          type: string
        party:
          type: string
        partyAbbreviation:
          type: string
        state:
          type: string
        photoUrl:
          type: string
        manifesto:
          type: string

    CandidateUpdate:
      type: object
      properties:
        fullName:
          type: string
        party:
          type: string
        partyAbbreviation:
          type: string
        state:
          type: string
        photoUrl:
          type: string
        manifesto:
          type: string

    VoteInput:
      type: object
      required: [electionId, candidateId, voterToken]
      properties:
        electionId:
          type: integer
        candidateId:
          type: integer
        voterToken:
          type: string
          description: JWT token from biometric verification

    VoteReceipt:
      type: object
      required: [receiptCode, electionId, timestamp]
      properties:
        receiptCode:
          type: string
        electionId:
          type: integer
        timestamp:
          type: string

    ReceiptVerification:
      type: object
      required: [valid, receiptCode, electionTitle, electionType, electionStatus, candidateName, party, partyAbbreviation, votedAt]
      properties:
        valid:
          type: boolean
        receiptCode:
          type: string
        electionTitle:
          type: string
        electionType:
          type: string
        electionStatus:
          type: string
        candidateName:
          type: string
        party:
          type: string
        partyAbbreviation:
          type: string
        votedAt:
          type: string

    ElectionResults:
      type: object
      required: [election, candidates, totalVotes, turnoutPercentage]
      properties:
        election:
          $ref: "#/components/schemas/Election"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CandidateResult"
        totalVotes:
          type: integer
        turnoutPercentage:
          type: number
        winner:
          $ref: "#/components/schemas/Candidate"

    CandidateResult:
      type: object
      required: [candidate, voteCount, percentage]
      properties:
        candidate:
          $ref: "#/components/schemas/Candidate"
        voteCount:
          type: integer
        percentage:
          type: number

    DashboardStats:
      type: object
      required: [totalVoters, verifiedVoters, totalElections, activeElections, totalVotesCast, registeredToday]
      properties:
        totalVoters:
          type: integer
        verifiedVoters:
          type: integer
        totalElections:
          type: integer
        activeElections:
          type: integer
        totalVotesCast:
          type: integer
        registeredToday:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, timestamp]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [voter_registered, vote_cast, election_created, election_started, election_ended]
        description:
          type: string
        state:
          type: ["string", "null"]
        timestamp:
          type: string

    TurnoutByState:
      type: object
      required: [state, registeredVoters, votesCast, turnoutPercentage]
      properties:
        state:
          type: string
        registeredVoters:
          type: integer
        votesCast:
          type: integer
        turnoutPercentage:
          type: number

    AuditVoteEntry:
      type: object
      required: [id, receiptCode, electionId, electionTitle, electionType, candidateName, party, partyAbbreviation, state, votedAt]
      properties:
        id:
          type: integer
        receiptCode:
          type: string
        electionId:
          type: integer
        electionTitle:
          type: string
        electionType:
          type: string
        candidateName:
          type: string
        party:
          type: string
        partyAbbreviation:
          type: string
        state:
          type: ["string", "null"]
        votedAt:
          type: string

    AuditPartyBreakdown:
      type: object
      required: [partyAbbreviation, party, candidateName, voteCount, percentage]
      properties:
        partyAbbreviation:
          type: string
        party:
          type: string
        candidateName:
          type: string
        voteCount:
          type: integer
        percentage:
          type: number

    AuditHourlyBucket:
      type: object
      required: [hour, voteCount]
      properties:
        hour:
          type: string
        voteCount:
          type: integer

    AuditElectionSummary:
      type: object
      required: [electionId, electionTitle, totalVotes, partyBreakdown]
      properties:
        electionId:
          type: integer
        electionTitle:
          type: string
        totalVotes:
          type: integer
        partyBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/AuditPartyBreakdown"

    AuditLogResponse:
      type: object
      required: [votes, totalCount, page, totalPages, elections, hourlyTimeline]
      properties:
        votes:
          type: array
          items:
            $ref: "#/components/schemas/AuditVoteEntry"
        totalCount:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
        elections:
          type: array
          items:
            $ref: "#/components/schemas/AuditElectionSummary"
        hourlyTimeline:
          type: array
          items:
            $ref: "#/components/schemas/AuditHourlyBucket"
